services:
  inventory-app:
    build: .
    container_name: inventory-system
    ports:
      - "3030:3030"
    volumes:
      # 掛載 src 和 public (應用代碼)，允許 git pull 更新生效
      - ./src:/app/src
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./package*.json:/app/package*.json
      - ./.env:/app/.env
      # 排除 node_modules 以防平台不相容
      - /app/node_modules
      # 確保資料庫與上傳目錄持久化
      - ./database:/app/database
      - ./uploads:/app/uploads
    env_file:
      - .env
    restart: always

# 此配置允許容器內的 git 指令直接修改掛載的宿主機檔案
# 當後端點擊更新並 exit(1) 後，Docker 會自動重啟並讀取新變更
