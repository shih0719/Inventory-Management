services:
  inventory-app:
    build: .
    container_name: inventory-system
    ports:
      - "3030:3030"
    volumes:
      # 掛載整個專案目錄 (開發模式方便熱重載，但在此主要是為了讓容器內的 git 更新生效到宿主機)
      # 為了實現 git pull 影響原始代碼，我們掛載當前路徑
      - .:/app
      # 排除 node_modules 以防平台不相容
      - /app/node_modules
      # 確保資料庫與上傳目錄持久化
      - ./database:/app/database
      - ./uploads:/app/uploads
    env_file:
      - .env
    restart: always

# 此配置允許容器內的 git 指令直接修改掛載的宿主機檔案
# 當後端點擊更新並 exit(1) 後，Docker 會自動重啟並讀取新變更
