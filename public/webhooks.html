<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webhooks | 庫房管理系統</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap");
  </style>
</head>

<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-blue-500 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-6">
          <a href="/" class="text-white text-2xl font-bold hover:text-blue-100">📦 庫房管理系統</a>
          <div class="hidden md:flex gap-4">
            <a href="/products.html" class="text-white hover:text-blue-100 py-4">📋 產品列表</a>
            <a href="/locations.html" class="text-white hover:text-blue-100 py-4">🏠 櫃位管理</a>
            <a href="/batches.html" class="text-white hover:text-blue-100 py-4">📦 批次查詢</a>
            <a href="/webhooks.html" class="text-white font-medium border-b-2 border-blue-300 py-4">🔔 Webhooks</a>
          </div>
        </div>
        <div class="flex gap-3 items-center">
          <!-- Language Switcher -->
          <div class="relative">
            <button id="lang-toggle" class="bg-white text-blue-500 px-3 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
              🌐
            </button>
            <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-xl border border-gray-200 z-50">
              <button data-lang="zh-TW" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇹🇼 繁體中文</button>
              <button data-lang="en" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇺🇸 English</button>
              <button data-lang="ja" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇯🇵 日本語</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-gray-800">🔔 Webhook 訂閱管理</h2>
        <button id="webhook-add-btn"
          class="bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition font-medium">
          ➕ 新增訂閱
        </button>
      </div>

      <p class="text-sm text-gray-600 mb-4">
        當系統發生指定事件時（如庫存變動、批次建立、低庫存），會 POST JSON 至訂閱的 URL。
        支援的事件：<code class="bg-gray-100 px-1 rounded">inventory.changed</code>、
        <code class="bg-gray-100 px-1 rounded">batch.created</code>、
        <code class="bg-gray-100 px-1 rounded">inventory.low</code>
      </p>

      <div id="webhooks-list" class="space-y-3">
        <!-- Webhooks will be populated by JS -->
      </div>
    </div>
  </main>

  <!-- Webhook Form Modal -->
  <div id="webhook-form-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-4" id="webhook-form-title">新增 Webhook</h3>
      <form id="webhook-form">
        <input type="hidden" id="webhook-id" name="id" />
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">名稱 *</label>
            <input type="text" id="webhook-name" name="name" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">URL *</label>
            <input type="url" id="webhook-url" name="url" required placeholder="http://192.168.1.50:5678/webhook/..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">訂閱事件</label>
            <div class="space-y-2">
              <label class="flex items-center">
                <input type="checkbox" name="events" class="webhook-event" value="inventory.changed" checked />
                <span class="ml-2 text-sm">inventory.changed（單筆庫存異動）</span>
              </label>
              <label class="flex items-center">
                <input type="checkbox" name="events" class="webhook-event" value="batch.created" checked />
                <span class="ml-2 text-sm">batch.created（批次建立）</span>
              </label>
            </div>
          </div>
          <div>
            <label class="flex items-center">
              <input type="checkbox" id="webhook-is-active" name="is_active" checked />
              <span class="ml-2 text-sm">啟用</span>
            </label>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="button" id="webhook-form-cancel"
            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
          <button type="submit"
            class="flex-1 bg-pink-500 text-white px-4 py-2 rounded-lg hover:bg-pink-600 transition">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="notification-container" class="fixed top-4 right-4 z-[60]"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
