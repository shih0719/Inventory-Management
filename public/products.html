<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>產品列表 | 庫房管理系統</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap");
  </style>
</head>

<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-blue-500 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-6">
          <a href="/" class="text-white text-2xl font-bold hover:text-blue-100">📦 庫房管理系統</a>
          <div class="hidden md:flex gap-4">
            <a href="/products.html" class="text-white font-medium border-b-2 border-blue-300 py-4">📋 產品列表</a>
            <a href="/locations.html" class="text-white hover:text-blue-100 py-4">🏠 櫃位管理</a>
            <a href="/batches.html" class="text-white hover:text-blue-100 py-4">📦 批次查詢</a>
            <a href="/webhooks.html" class="text-white hover:text-blue-100 py-4">🔔 Webhooks</a>
          </div>
        </div>
        <div class="flex gap-3 items-center">
          <button id="csv-template-btn" data-i18n="nav.downloadTemplate"
            class="bg-white text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
            📋 下載範本
          </button>
          <label for="csv-import-input" data-i18n="nav.importCSV"
            class="bg-white text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-50 transition cursor-pointer font-medium shadow">
            📥 匯入 CSV
          </label>
          <input type="file" id="csv-import-input" accept=".csv" class="hidden" />
          <button id="csv-export-btn" data-i18n="nav.exportCSV"
            class="bg-white text-blue-500 px-4 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
            📤 匯出 CSV
          </button>

          <!-- Language Switcher -->
          <div class="relative">
            <button id="lang-toggle" class="bg-white text-blue-500 px-3 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
              🌐
            </button>
            <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-xl border border-gray-200 z-50">
              <button data-lang="zh-TW" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇹🇼 繁體中文</button>
              <button data-lang="en" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇺🇸 English</button>
              <button data-lang="ja" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇯🇵 日本語</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Filters Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4" data-i18n="filters.title">🔍 篩選條件</h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="filters.sku">產品編碼 (SKU)</label>
          <input type="text" id="filter-sku" data-i18n="filters.sku"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="filters.name">產品名稱</label>
          <input type="text" id="filter-name" data-i18n="filters.name"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="filters.model">型號</label>
          <input type="text" id="filter-model" data-i18n="filters.model"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="filters.tag">標籤</label>
          <select id="filter-tag"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">全部標籤</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="filter-low-stock" class="w-4 h-4 text-red-600 rounded border-gray-300" />
          <label for="filter-low-stock" class="text-sm font-medium text-gray-700" data-i18n="filters.lowStock">⚠️ 只顯示低庫存</label>
        </div>
        <div class="flex items-end gap-2 flex-wrap md:col-span-full xl:col-span-1">
          <button id="add-product-btn" data-i18n="filters.addProduct"
            class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition font-medium shadow-md text-sm whitespace-nowrap">
            ➕ 新增產品
          </button>
          <button id="batch-transaction-btn" data-i18n="filters.batchTransaction"
            class="flex-1 bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 transition font-medium shadow-md text-sm whitespace-nowrap">
            📦 批次異動
          </button>
        </div>
      </div>
    </div>

    <!-- Products Table (Desktop) -->
    <div class="bg-white rounded-lg shadow-md overflow-hidden table-desktop">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-blue-500">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">SKU</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">名稱</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">類型</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">型號</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">有帳庫存</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">無帳庫存</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">操作</th>
            </tr>
          </thead>
          <tbody id="products-table-body" class="bg-white divide-y divide-gray-200">
            <!-- Products will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Products Cards (Mobile) -->
    <div id="products-cards" class="table-mobile-card space-y-4">
      <!-- Product cards will be inserted here -->
    </div>

    <!-- Pagination -->
    <div id="pagination-container" class="bg-white rounded-lg shadow-md p-4 mt-6">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-sm text-gray-600">
          共 <span id="total-products" class="font-semibold text-blue-600">0</span> 筆產品
        </div>
        <div id="pagination-buttons" class="flex gap-2">
          <!-- Pagination buttons will be inserted here -->
        </div>
      </div>
    </div>
  </main>

  <!-- Add/Edit Product Modal -->
  <div id="product-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-4" id="product-modal-title">新增產品</h3>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">產品編碼 (SKU) *</label>
            <input type="text" id="product-sku" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">名稱 *</label>
            <input type="text" id="product-name" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">類型 *</label>
            <input type="text" id="product-type" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">型號</label>
            <input type="text" id="product-model"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">有帳初始庫存</label>
            <input type="number" id="product-accountable-qty" value="0" min="0"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">無帳初始庫存</label>
            <input type="number" id="product-non-accountable-qty" value="0" min="0"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">最低庫存閾值 (Min Stock)</label>
            <input type="number" id="product-min-stock" value="0" min="0"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div class="flex items-center gap-3">
            <input type="checkbox" id="product-track-serial" class="w-4 h-4 text-blue-600 rounded border-gray-300" />
            <label for="product-track-serial" class="text-sm font-medium text-gray-700">逐台追蹤序號（高單價商品）</label>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="button" id="product-modal-cancel"
            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
          <button type="submit" class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Transaction Modal -->
  <div id="transaction-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-4">庫存異動</h3>
      <form id="transaction-form">
        <input type="hidden" id="transaction-product-id" />
        <div class="mb-4 p-4 bg-blue-50 rounded-lg">
          <p class="text-sm text-gray-600">產品：<span id="transaction-product-name" class="font-medium text-gray-800"></span></p>
          <p class="text-sm text-gray-600 mt-1">有帳庫存：<span id="transaction-accountable-qty" class="font-semibold text-green-600"></span></p>
          <p class="text-sm text-gray-600 mt-1">無帳庫存：<span id="transaction-non-accountable-qty" class="font-semibold text-gray-600"></span></p>
        </div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">異動類型 *</label>
            <select id="transaction-quantity-type" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="accountable">有帳</option>
              <option value="non_accountable">無帳</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">出入庫類型 *</label>
            <div class="flex gap-3">
              <label class="flex items-center gap-2">
                <input type="radio" name="transaction-type" value="inbound" checked class="w-4 h-4" />
                <span class="text-sm">入庫 (正數)</span>
              </label>
              <label class="flex items-center gap-2">
                <input type="radio" name="transaction-type" value="outbound" class="w-4 h-4" />
                <span class="text-sm">出庫 (負數)</span>
              </label>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">數量 *</label>
            <input type="number" id="transaction-quantity" required placeholder="請輸入數量" min="1"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">說明</label>
            <textarea id="transaction-remarks" rows="3" placeholder="備註資訊..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="button" id="transaction-modal-cancel"
            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
          <button type="submit" class="flex-1 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">確認異動</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Batch Modal -->
  <div id="batch-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold text-gray-800 mb-4">📦 批次異動</h3>
      <form id="batch-form">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">標籤 *</label>
            <select id="batch-tag" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">選擇標籤...</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">說明</label>
            <textarea id="batch-description" rows="2" placeholder="此批次的整體說明..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
          <div class="border-t pt-4">
            <div class="flex justify-between items-center mb-3">
              <h4 class="font-medium text-gray-800">產品列表</h4>
              <button type="button" id="add-batch-item-btn"
                class="bg-blue-500 text-white px-3 py-1 rounded-lg hover:bg-blue-600 text-sm">➕ 新增產品</button>
            </div>
            <div id="batch-items-container" class="space-y-3"></div>
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="button" id="batch-modal-cancel"
            class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
          <button type="submit"
            class="flex-1 bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 transition">確認批次異動</button>
        </div>
      </form>
    </div>
  </div>

  <div id="notification-container" class="fixed top-4 right-4 z-[60]"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
