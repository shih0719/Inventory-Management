<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>櫃位管理 | 庫房管理系統</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap");
  </style>
</head>

<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-blue-500 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-6">
          <a href="/" class="text-white text-2xl font-bold hover:text-blue-100">📦 庫房管理系統</a>
          <div class="hidden md:flex gap-4">
            <a href="/products.html" class="text-white hover:text-blue-100 py-4">📋 產品列表</a>
            <a href="/locations.html" class="text-white font-medium border-b-2 border-blue-300 py-4">🏠 櫃位管理</a>
            <a href="/batches.html" class="text-white hover:text-blue-100 py-4">📦 批次查詢</a>
            <a href="/webhooks.html" class="text-white hover:text-blue-100 py-4">🔔 Webhooks</a>
          </div>
        </div>
        <div class="flex gap-3 items-center">
          <!-- Language Switcher -->
          <div class="relative">
            <button id="lang-toggle" class="bg-white text-blue-500 px-3 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
              🌐
            </button>
            <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-xl border border-gray-200 z-50">
              <button data-lang="zh-TW" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇹🇼 繁體中文</button>
              <button data-lang="en" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇺🇸 English</button>
              <button data-lang="ja" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇯🇵 日本語</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Locations Management Section -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4" data-i18n="nav.locations">🏠 櫃位管理</h2>

      <div class="flex flex-col lg:flex-row gap-6 mb-4">
        <!-- Quick Search / Scan Form -->
        <form id="location-scan-form" class="flex-1 p-4 bg-teal-50 rounded-lg border border-teal-200">
          <h3 class="font-bold text-teal-800 mb-2">🔍 快速掃描 / 查詢櫃位</h3>
          <div class="flex gap-2">
            <input type="text" id="scan-location-input" required placeholder="掃描條碼或輸入櫃位名稱..."
              class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-teal-500" autocomplete="off" />
            <button type="button" id="open-camera-btn"
              class="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg hover:bg-gray-300 transition"
              title="使用相機掃描">📷</button>
            <button type="submit"
              class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 font-medium">查詢</button>
          </div>
        </form>

        <!-- Create Location Form -->
        <form id="location-create-form" class="flex-1 p-4 bg-gray-50 rounded-lg border border-gray-200">
          <h3 class="font-bold text-gray-800 mb-2">➕ 新增櫃位</h3>
          <div class="flex flex-col sm:flex-row gap-2">
            <input type="text" id="new-location-name" required placeholder="名稱 / 標籤"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" />
            <input type="text" id="new-location-desc" placeholder="描述 (選填)"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500" />
            <button type="submit"
              class="sm:w-auto w-full bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition font-medium whitespace-nowrap">新增</button>
          </div>
        </form>
      </div>

      <div class="overflow-x-auto border rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">櫃位名稱</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">描述</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">建立時間</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">操作</th>
            </tr>
          </thead>
          <tbody id="locations-table-body" class="bg-white divide-y divide-gray-200">
            <!-- Locations will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Camera Scan Modal -->
  <div id="camera-scan-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 p-6 text-center">
      <h3 class="text-xl font-bold text-gray-800 mb-4">📷 掃描 QR Code / 條碼</h3>
      <div id="reader" class="w-full overflow-hidden rounded-lg mb-4"></div>
      <div class="flex justify-end">
        <button id="camera-scan-modal-close"
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">取消 / 關閉</button>
      </div>
    </div>
  </div>

  <!-- Location QR Code Modal -->
  <div id="location-qrcode-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-sm w-full mx-4 p-6 text-center">
      <h3 class="text-xl font-bold text-gray-800 mb-2">🏷️ 櫃位標籤</h3>
      <p class="text-sm text-gray-600 mb-4">櫃位名稱：<span id="qr-modal-location-name"
          class="font-bold text-teal-600"></span></p>
      <div id="qrcode-container" class="flex justify-center mb-6 p-4 bg-white border rounded-lg shadow-inner"></div>
      <p class="text-xs text-gray-400 mb-6">手機掃描上圖可直接進入此櫃位內容</p>
      <div class="flex gap-3">
        <button id="location-qrcode-modal-print"
          class="flex-1 bg-teal-500 text-white px-4 py-2 rounded-lg hover:bg-teal-600 transition font-medium">列印標籤</button>
        <button id="location-qrcode-modal-close"
          class="flex-1 bg-gray-200 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-300 transition">關閉</button>
      </div>
    </div>
  </div>

  <!-- Location Content Modal -->
  <div id="location-content-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold text-gray-800 mb-4">📦 櫃位內容</h3>

      <div class="mb-4 p-4 bg-gray-50 rounded-lg">
        <p class="text-sm text-gray-600">櫃位：<span id="lc-modal-location-name" class="font-bold text-teal-600"></span>
        </p>
        <p class="text-sm text-gray-600">描述：<span id="lc-modal-location-desc" class="text-gray-800"></span></p>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">SKU</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">產品名稱</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">類型</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">型號</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">操作</th>
            </tr>
          </thead>
          <tbody id="lc-modal-table-body" class="bg-white divide-y divide-gray-200">
            <!-- Products in location will go here -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-end mt-6">
        <button id="location-content-modal-close"
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">關閉</button>
      </div>
    </div>
  </div>

  <div id="notification-container" class="fixed top-4 right-4 z-[60]"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
