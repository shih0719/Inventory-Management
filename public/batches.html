<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>批次查詢 | 庫房管理系統</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap");
  </style>
</head>

<body class="bg-gray-50">
  <!-- Navigation -->
  <nav class="bg-blue-500 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center gap-6">
          <a href="/" class="text-white text-2xl font-bold hover:text-blue-100">📦 庫房管理系統</a>
          <div class="hidden md:flex gap-4">
            <a href="/products.html" class="text-white hover:text-blue-100 py-4">📋 產品列表</a>
            <a href="/locations.html" class="text-white hover:text-blue-100 py-4">🏠 櫃位管理</a>
            <a href="/batches.html" class="text-white font-medium border-b-2 border-blue-300 py-4">📦 批次查詢</a>
            <a href="/webhooks.html" class="text-white hover:text-blue-100 py-4">🔔 Webhooks</a>
          </div>
        </div>
        <div class="flex gap-3 items-center">
          <!-- Language Switcher -->
          <div class="relative">
            <button id="lang-toggle" class="bg-white text-blue-500 px-3 py-2 rounded-lg hover:bg-blue-50 transition font-medium shadow">
              🌐
            </button>
            <div id="lang-menu" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-xl border border-gray-200 z-50">
              <button data-lang="zh-TW" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇹🇼 繁體中文</button>
              <button data-lang="en" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇺🇸 English</button>
              <button data-lang="ja" class="w-full text-left px-4 py-2 hover:bg-blue-50 flex items-center gap-2">🇯🇵 日本語</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4" data-i18n="nav.batches">📋 批次查詢</h2>

      <div class="overflow-x-auto border rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">批次編號</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">說明</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">產品數量</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">入庫總數</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">出庫總數</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">時間</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">操作</th>
            </tr>
          </thead>
          <tbody id="batches-table-body" class="bg-white divide-y divide-gray-200">
            <!-- Batches will be inserted here -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-end mt-6">
        <button id="batches-modal-close"
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">關閉</button>
      </div>
    </div>
  </main>

  <!-- Batch Details Modal -->
  <div id="batch-details-modal" class="modal">
    <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
      <h3 class="text-xl font-bold text-gray-800 mb-4">批次詳情</h3>

      <div class="mb-4 p-4 bg-purple-50 rounded-lg">
        <p class="text-sm text-gray-600">
          批次編號：<span id="batch-detail-number" class="font-medium text-gray-800"></span>
        </p>
        <p class="text-sm text-gray-600">
          說明：<span id="batch-detail-description" class="font-medium text-gray-800"></span>
        </p>
        <p class="text-sm text-gray-600">
          時間：<span id="batch-detail-time" class="font-medium text-gray-800"></span>
        </p>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">SKU</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">產品名稱</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">標籤</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">變動量</th>
              <th class="px-4 py-3 text-left text-xs font-medium text-gray-700 uppercase">說明</th>
            </tr>
          </thead>
          <tbody id="batch-detail-table-body" class="bg-white divide-y divide-gray-200">
            <!-- Batch detail records will be inserted here -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-end mt-6">
        <button id="batch-details-modal-close"
          class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">關閉</button>
      </div>
    </div>
  </div>

  <div id="notification-container" class="fixed top-4 right-4 z-[60]"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
