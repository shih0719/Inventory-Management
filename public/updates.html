<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統更新 - 庫存管理系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status-card {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e9ecef;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      color: #666;
      font-weight: 500;
    }

    .status-value {
      color: #333;
      font-weight: 600;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .version-badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .update-available {
      background: #fff3cd;
      border: 2px solid #ffc107;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .update-available h3 {
      color: #ff9800;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .update-available p {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #e9ecef;
      color: #333;
    }

    .btn-secondary:hover {
      background: #dee2e6;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e9ecef;
      font-size: 12px;
      color: #999;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← 返回首頁</a>

    <h1>🔄 系統更新</h1>
    <p class="subtitle">檢查和應用最新版本的庫存管理系統</p>

    <div id="message" class="message"></div>

    <div class="status-card">
      <div class="status-item">
        <span class="status-label">當前版本</span>
        <span class="status-value" id="currentVersion">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">遠端版本</span>
        <span class="status-value" id="remoteVersion">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">最後檢查</span>
        <span class="status-value" id="lastCheck">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">更新狀態</span>
        <span class="status-value" id="updateStatus">-</span>
      </div>
    </div>

    <div id="updateAvailable" class="update-available" style="display: none;">
      <h3>🎉 有新版本可用！</h3>
      <p>發現新的版本更新。點擊下方按鈕可立即更新至最新版本。更新過程中應用會自動重啟。</p>
    </div>

    <div id="updating" class="loading">
      <div class="spinner"></div>
      <p>更新中，請稍候... 應用將自動重啟</p>
    </div>

    <div class="button-group">
      <button class="btn-secondary" onclick="checkUpdates()">🔍 檢查更新</button>
      <button class="btn-primary" id="updateBtn" onclick="applyUpdate()" disabled>📥 應用更新</button>
    </div>

    <div class="footer">
      <p>💾 系統會自動每小時備份一次資料庫</p>
      <p>🔄 更新過程安全可靠，遇到問題可從備份恢復</p>
    </div>
  </div>

  <script>
    const API_BASE = '/api/updates';
    let updateStatus = null;

    // 頁面加載時獲取狀態
    document.addEventListener('DOMContentLoaded', () => {
      loadStatus();
    });

    async function loadStatus() {
      try {
        const response = await fetch(`${API_BASE}/status`);
        const data = await response.json();
        updateStatus = data;
        renderStatus(data);
      } catch (error) {
        showMessage('無法載入更新狀態：' + error.message, 'error');
      }
    }

    async function checkUpdates() {
      try {
        showMessage('正在檢查更新...', 'info');
        const response = await fetch(`${API_BASE}/check`, { method: 'POST' });
        const data = await response.json();
        updateStatus = data;
        renderStatus(data);

        if (data.available) {
          showMessage('✅ 發現新版本，點擊「應用更新」按鈕開始更新', 'success');
        } else {
          showMessage('✓ 已是最新版本', 'success');
        }
      } catch (error) {
        showMessage('檢查更新失敗：' + error.message, 'error');
      }
    }

    async function applyUpdate() {
      if (!updateStatus?.available) {
        showMessage('⚠ 目前沒有可用的更新', 'info');
        return;
      }

      if (!confirm('確認要更新系統嗎？\n\n更新期間應用會自動重啟，請稍候')) {
        return;
      }

      try {
        document.getElementById('updateBtn').disabled = true;
        document.getElementById('updating').style.display = 'block';
        showMessage('更新已開始，應用將自動重啟...', 'info');

        const response = await fetch(`${API_BASE}/apply`, { method: 'POST' });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || '更新失敗');
        }

        // 每 2 秒檢查一次應用是否已重啟
        setTimeout(() => {
          pollForRestart();
        }, 3000);
      } catch (error) {
        document.getElementById('updateBtn').disabled = false;
        document.getElementById('updating').style.display = 'none';
        showMessage('更新失敗：' + error.message, 'error');
      }
    }

    function pollForRestart() {
      fetch('/api/health')
        .then(res => {
          if (res.ok) {
            // 應用已重啟
            document.getElementById('updating').style.display = 'none';
            loadStatus();
            showMessage('✅ 更新完成！應用已重啟', 'success');
            setTimeout(() => loadStatus(), 1000);
          }
        })
        .catch(() => {
          // 應用還在重啟中
          setTimeout(pollForRestart, 2000);
        });
    }

    function renderStatus(data) {
      document.getElementById('currentVersion').textContent = data.currentVersion;
      document.getElementById('remoteVersion').textContent = data.remoteCommit?.substring(0, 7) || '-';
      document.getElementById('lastCheck').textContent = data.lastCheckTime
        ? new Date(data.lastCheckTime).toLocaleString('zh-TW')
        : '-';

      const statusText = data.isUpdating ? '🔄 更新中' : (data.available ? '✨ 有新版本' : '✓ 已是最新');
      document.getElementById('updateStatus').textContent = statusText;

      const updateBtn = document.getElementById('updateBtn');
      updateBtn.disabled = !data.available || data.isUpdating;

      const updateAvailableDiv = document.getElementById('updateAvailable');
      updateAvailableDiv.style.display = data.available ? 'block' : 'none';

      if (data.error) {
        showMessage('錯誤：' + data.error, 'error');
      }
    }

    function showMessage(text, type) {
      const msgEl = document.getElementById('message');
      msgEl.textContent = text;
      msgEl.className = 'message ' + type;
      setTimeout(() => {
        msgEl.className = 'message';
      }, 5000);
    }
  </script>
</body>
</html>
